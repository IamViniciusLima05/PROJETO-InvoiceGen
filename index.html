<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvoiceGen | Orçamentos e faturas</title>
  <meta name="description" content="Gerador de orçamentos e faturas com cliente, itens, valores e desconto, com exportação em PDF.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <p class="marca">Invoice<b>Gen</b></p>
    <div class="topo__acoes">
      <button class="btn sec" id="abrir-salvos">Documentos salvos <span class="num" id="n-salvos">0</span></button>
      <button class="btn sec" id="novo-doc">Novo</button>
      <button class="btn sec" id="salvar-doc">Salvar</button>
      <button class="btn" id="pdf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg> Baixar PDF</button>
    </div>
  </header>

  <div class="layout">
    <form class="editor" id="editor" autocomplete="off">
      <section class="bloco">
        <h2>Documento</h2>
        <div class="tipos" role="radiogroup" aria-label="Tipo de documento">
          <label><input type="radio" name="tipo" value="orcamento" checked><span>Orçamento</span></label>
          <label><input type="radio" name="tipo" value="fatura"><span>Fatura</span></label>
          <label><input type="radio" name="tipo" value="recibo"><span>Recibo</span></label>
        </div>
        <div class="grade3">
          <label>Número<input id="numero" maxlength="20"></label>
          <label>Emissão<input id="emissao" type="date"></label>
          <label id="rot-validade">Validade<input id="validade" type="date"></label>
        </div>
        <label class="cor-campo">Cor do documento
          <span class="cores" id="cores"></span>
        </label>
      </section>

      <details class="bloco" id="bloco-emitente">
        <summary><h2>Seus dados</h2><small id="resumo-emitente"></small></summary>
        <div class="grade2">
          <label class="cheia">Nome ou empresa<input id="em-nome" maxlength="60"></label>
          <label>CPF / CNPJ<input id="em-doc" maxlength="20" inputmode="numeric"></label>
          <label>Telefone<input id="em-tel" maxlength="20"></label>
          <label>E-mail<input id="em-email" maxlength="60"></label>
          <label>Site<input id="em-site" maxlength="60"></label>
          <label class="cheia">Endereço<input id="em-end" maxlength="100"></label>
        </div>
        <p class="nota">Seus dados ficam salvos para os próximos documentos.</p>
      </details>

      <section class="bloco">
        <h2>Cliente</h2>
        <div class="grade2">
          <label class="cheia">Nome<input id="cl-nome" maxlength="60" list="clientes-salvos"></label>
          <label>CPF / CNPJ<input id="cl-doc" maxlength="20" inputmode="numeric"></label>
          <label>E-mail ou telefone<input id="cl-contato" maxlength="60"></label>
          <label class="cheia">Endereço<input id="cl-end" maxlength="100"></label>
        </div>
        <datalist id="clientes-salvos"></datalist>
      </section>

      <section class="bloco">
        <h2>Itens</h2>
        <div class="itens-cab" aria-hidden="true"><span>Descrição</span><span>Qtd.</span><span>Valor unit.</span><span>Total</span><span></span></div>
        <ol class="itens" id="itens"></ol>
        <button type="button" class="link" id="add-item">+ Adicionar item</button>
        <div class="ajustes">
          <label>Desconto
            <span class="desconto">
              <input id="desconto" inputmode="decimal" placeholder="0">
              <select id="desc-tipo" aria-label="Tipo de desconto"><option value="pct">%</option><option value="valor">R$</option></select>
            </span>
          </label>
          <label>Frete / taxa (R$)<input id="taxa" inputmode="decimal" placeholder="0,00"></label>
        </div>
      </section>

      <section class="bloco">
        <h2>Condições</h2>
        <label>Forma de pagamento<input id="pagamento" maxlength="80" placeholder="Ex.: Pix, 50% na aprovação e 50% na entrega"></label>
        <label>Observações<textarea id="obs" rows="3" maxlength="500" placeholder="Prazo de entrega, garantia, o que não está incluso…"></textarea></label>
      </section>
    </form>

    <div class="previa-area">
      <p class="previa-rotulo">Prévia do documento</p>
      <article class="doc" id="doc" aria-label="Prévia do documento"></article>
    </div>
  </div>

  <dialog id="dlg-salvos" aria-labelledby="ds-titulo">
    <div class="salvos">
      <div class="salvos__topo"><h2 id="ds-titulo">Documentos salvos</h2><button class="fechar" data-fechar aria-label="Fechar">×</button></div>
      <ul id="lista-salvos"></ul>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="js/script.js"></script>
</body>
</html>
